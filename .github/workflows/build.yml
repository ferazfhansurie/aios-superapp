name: build

# Builds the supported macOS desktop app. On a plain push it compiles and
# uploads the installer as a run artifact. On a `v*` tag it also prepares a
# draft GitHub Release.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend deps
        run: pnpm install --frozen-lockfile

      - name: verify frontend and shared contracts
        run: |
          pnpm build
          pnpm test:router
          pnpm test:codex-adapter
          pnpm test:chatpane
          pnpm test:lsp
          pnpm test:cfo

      - name: verify rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: use ad-hoc mac signing in ci
        if: runner.os == 'macOS'
        run: |
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.bundle.macOS.signingIdentity='-';fs.writeFileSync(p,JSON.stringify(c,null,2));"

      - name: build (tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # only cut a Release on a tag push; plain pushes just build
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && 'AIOS __VERSION__' || '' }}
          releaseDraft: true

      - name: upload installers
        uses: actions/upload-artifact@v4
        with:
          name: aios-macos
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
