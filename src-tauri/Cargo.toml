[package]
name = "aios-shell"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aios_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
portable-pty = "0.8"
parking_lot = "0.12"
sysinfo = { version = "0.32", default-features = false, features = ["system", "disk"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio-rustls",
  "postgres",
  "mysql",
  "chrono",
  "json",
  "bigdecimal",
  "uuid",
] }
tokio = { version = "1", features = ["rt-multi-thread"] }

# macOS-only: flip the WKWebView element-fullscreen preference (off by default)
# so YouTube/video fullscreen works inside browser panes. Pinned to the same
# objc2-web-kit version tauri 2.11 uses so the WKWebView types unify.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKPreferences"] }

